<svg height="400" viewBox="0 0 1280 400" width="1280" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Background Gradients -->
<linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#0a0d14"></stop>
<stop offset="45%" stop-color="#0d1117"></stop>
<stop offset="100%" stop-color="#161b22"></stop>
</linearGradient>
<!-- Accent Glows -->
<radialGradient cx="85%" cy="30%" id="glowCyan" r="50%">
<stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"></stop>
<stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.05"></stop>
<stop offset="100%" stop-color="#0a0d14" stop-opacity="0"></stop>
</radialGradient>
<radialGradient cx="20%" cy="85%" id="glowIndigo" r="45%">
<stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"></stop>
<stop offset="60%" stop-color="#4f46e5" stop-opacity="0.03"></stop>
<stop offset="100%" stop-color="#0a0d14" stop-opacity="0"></stop>
</radialGradient>
<!-- Card Background Gradient -->
<linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#1f2937" stop-opacity="0.6"></stop>
<stop offset="100%" stop-color="#111827" stop-opacity="0.8"></stop>
</linearGradient>
<!-- Syntax Colors -->
<linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#ffffff"></stop>
<stop offset="100%" stop-color="#cbd5e1"></stop>
</linearGradient>
<!-- Grid Pattern -->
<pattern height="32" id="grid" patternUnits="userSpaceOnUse" width="32">
<path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-opacity="0.25" stroke-width="0.75"></path>
<circle cx="32" cy="0" fill="#475569" fill-opacity="0.35" r="1"></circle>
</pattern>
</defs>
<!-- Background Base -->
<rect fill="url(#bgGrad)" height="400" width="1280"></rect>
<rect fill="url(#grid)" height="400" width="1280"></rect>
<!-- Ambient Ambient Lighting -->
<rect fill="url(#glowCyan)" height="400" width="1280"></rect>
<rect fill="url(#glowIndigo)" height="400" width="1280"></rect>
<!-- Left Accent Tech Line -->
<line stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" x1="0" x2="1280" y1="0" y2="0"></line>
<line stroke="#38bdf8" stroke-linecap="round" stroke-width="2" x1="80" x2="140" y1="56" y2="56"></line>
<!-- Top Status Badge -->
<g transform="translate(80, 50)">
<rect fill="#1e293b" fill-opacity="0.7" height="26" rx="13" stroke="#334155" stroke-width="1" width="138" x="0" y="0"></rect>
<circle cx="14" cy="13" fill="#10b981" r="4">
<animate attributeName="opacity" dur="2.5s" repeatCount="indefinite" values="1;0.4;1"></animate>
</circle>
<text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em" x="26" y="17">AVAILABLE FOR HIRE</text>
</g>
<!-- Main Left Content Info -->
<!-- Name -->
<text fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em" x="80" y="142">Samuel Nelson</text>
<!-- Title with Code Prompt Aesthetic -->
<g transform="translate(80, 168)">
<text fill="#38bdf8" font-family="'JetBrains Mono', 'Fira Code', 'Roboto Mono', Monaco, monospace" font-size="20" font-weight="600" x="0" y="20">$&gt;</text>
<text fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.01em" x="28" y="20">Full-Stack Software Engineer</text>
</g>
<!-- Tagline -->
<text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="15.5" font-weight="400" letter-spacing="0.01em" x="80" y="228">Building useful software. Automating complex workflows.</text>
<!-- Divider Line -->
<line stroke="#334155" stroke-opacity="0.6" stroke-width="1" x1="80" x2="680" y1="262" y2="262"></line>
<!-- Technologies Section (Modern Pill Badges) -->
<g transform="translate(80, 290)">
<!-- Label -->
<text fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', Monaco, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" x="0" y="21">TECH_STACK // </text>
<!-- Tech Badges Container -->
<!-- TypeScript -->
<g transform="translate(108, 2)">
<rect fill="#172554" fill-opacity="0.7" height="28" rx="6" stroke="#1d4ed8" stroke-width="1" width="88" x="0" y="0"></rect>
<text fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" text-anchor="middle" x="44" y="18">TypeScript</text>
</g>
<!-- React -->
<g transform="translate(204, 2)">
<rect fill="#082f49" fill-opacity="0.7" height="28" rx="6" stroke="#0284c7" stroke-width="1" width="62" x="0" y="0"></rect>
<text fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" text-anchor="middle" x="31" y="18">React</text>
</g>
<!-- React Native -->
<g transform="translate(274, 2)">
<rect fill="#082f49" fill-opacity="0.7" height="28" rx="6" stroke="#0284c7" stroke-width="1" width="104" x="0" y="0"></rect>
<text fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" text-anchor="middle" x="52" y="18">React Native</text>
</g>
<!-- C -->
<g transform="translate(386, 2)">
<rect fill="#1e1e2e" fill-opacity="0.7" height="28" rx="6" stroke="#4b5563" stroke-width="1" width="38" x="0" y="0"></rect>
<text fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle" x="19" y="18">C</text>
</g>
<!-- Go -->
<g transform="translate(432, 2)">
<rect fill="#042f2e" fill-opacity="0.7" height="28" rx="6" stroke="#0d9488" stroke-width="1" width="44" x="0" y="0"></rect>
<text fill="#5eead4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle" x="22" y="18">Go</text>
</g>
<!-- PostgreSQL -->
<g transform="translate(484, 2)">
<rect fill="#172554" fill-opacity="0.6" height="28" rx="6" stroke="#2563eb" stroke-width="1" width="94" x="0" y="0"></rect>
<text fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" text-anchor="middle" x="47" y="18">PostgreSQL</text>
</g>
</g>
<!-- Row 2 of Tech Badges -->
<g transform="translate(188, 328)">
<!-- MongoDB -->
<g transform="translate(0, 0)">
<rect fill="#052e16" fill-opacity="0.6" height="28" rx="6" stroke="#16a34a" stroke-width="1" width="84" x="0" y="0"></rect>
<text fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" text-anchor="middle" x="42" y="18">MongoDB</text>
</g>
<!-- REST APIs -->
<g transform="translate(92, 0)">
<rect fill="#2e1065" fill-opacity="0.6" height="28" rx="6" stroke="#7c3aed" stroke-width="1" width="88" x="0" y="0"></rect>
<text fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" text-anchor="middle" x="44" y="18">REST APIs</text>
</g>
<!-- Minimal system dot indicator -->
<text fill="#475569" font-family="'JetBrains Mono', monospace" font-size="11" x="194" y="18">system: active</text>
</g>
<!-- Right Visual Element: Sleek Code / Terminal Window -->
<g transform="translate(775, 48)">
<!-- Glassmorphic Drop Shadow -->
<rect fill="#000000" fill-opacity="0.4" filter="blur(10px)" height="304" rx="12" width="425" x="4" y="4"></rect>
<!-- Code Editor Card -->
<rect fill="url(#cardGrad)" height="304" rx="12" stroke="#334155" stroke-width="1.2" width="425" x="0" y="0"></rect>
<!-- Editor Header Bar -->
<rect fill="#1e293b" fill-opacity="0.8" height="36" rx="12" width="425" x="0" y="0"></rect>
<!-- Bottom square corners for top bar -->
<rect fill="#1e293b" fill-opacity="0.8" height="12" width="425" x="0" y="24"></rect>
<line stroke="#334155" stroke-width="1" x1="0" x2="425" y1="36" y2="36"></line>
<!-- Window Controls -->
<circle cx="20" cy="18" fill="#ef4444" fill-opacity="0.85" r="5"></circle>
<circle cx="36" cy="18" fill="#f59e0b" fill-opacity="0.85" r="5"></circle>
<circle cx="52" cy="18" fill="#10b981" fill-opacity="0.85" r="5"></circle>
<!-- Tab Title -->
<rect fill="#0f172a" fill-opacity="0.7" height="22" rx="4" width="136" x="74" y="8"></rect>
<text fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" x="86" y="23">engineer.ts</text>
<circle cx="196" cy="18" fill="#38bdf8" r="3"></circle>
<!-- Code Content -->
<g font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="12.5" xml:space="preserve">
<!-- Line Numbers -->
<g fill="#475569" font-size="11.5" text-anchor="end">
<text x="28" y="66">1</text>
<text x="28" y="90">2</text>
<text x="28" y="114">3</text>
<text x="28" y="138">4</text>
<text x="28" y="162">5</text>
<text x="28" y="186">6</text>
<text x="28" y="210">7</text>
<text x="28" y="234">8</text>
<text x="28" y="258">9</text>
<text x="28" y="282">10</text>
</g>
<!-- Code Text Lines -->
<g transform="translate(42, 0)">
<!-- Line 1: const engineer = { -->
<text y="66">
<tspan fill="#f43f5e">const </tspan>
<tspan fill="#38bdf8">engineer </tspan>
<tspan fill="#cbd5e1">= {</tspan>
</text>
<!-- Line 2: name: "Samuel Nelson", -->
<text y="90">
<tspan fill="#cbd5e1">  name: </tspan>
<tspan fill="#34d399">"Samuel Nelson"</tspan>
<tspan fill="#cbd5e1">,</tspan>
</text>
<!-- Line 3: role: "Full-Stack", -->
<text y="114">
<tspan fill="#cbd5e1">  role: </tspan>
<tspan fill="#34d399">"Full-Stack Dev"</tspan>
<tspan fill="#cbd5e1">,</tspan>
</text>
<!-- Line 4: focus: [ -->
<text y="138">
<tspan fill="#cbd5e1">  focus: [</tspan>
<tspan fill="#38bdf8">"Scale"</tspan>
<tspan fill="#cbd5e1">, </tspan>
<tspan fill="#38bdf8">"Automation"</tspan>
<tspan fill="#cbd5e1">],</tspan>
</text>
<!-- Line 5: build: async () =&gt; { -->
<text y="162">
<tspan fill="#a855f7">  build</tspan>
<tspan fill="#cbd5e1">: </tspan>
<tspan fill="#f43f5e">async </tspan>
<tspan fill="#cbd5e1">() =&gt; {</tspan>
</text>
<!-- Line 6: await deploy({ -->
<text y="186">
<tspan fill="#f43f5e">    await </tspan>
<tspan fill="#60a5fa">shipImpactfulSoftware</tspan>
<tspan fill="#cbd5e1">({</tspan>
</text>
<!-- Line 7: quality: "robust", -->
<text y="210">
<tspan fill="#94a3b8">      quality: </tspan>
<tspan fill="#34d399">"production"</tspan>
<tspan fill="#cbd5e1">,</tspan>
</text>
<!-- Line 8: status: 200 -->
<text y="234">
<tspan fill="#94a3b8">      fast: </tspan>
<tspan fill="#f59e0b">true</tspan>
</text>
<!-- Line 9: }); -->
<text y="258">
<tspan fill="#cbd5e1">    });</tspan>
</text>
<!-- Line 10: } }; -->
<text y="282">
<tspan fill="#cbd5e1">  }</tspan>
<tspan fill="#cbd5e1">};</tspan>
<!-- Blinking cursor -->
<rect fill="#38bdf8" height="14" width="7" x="36" y="271">
<animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;0;1"></animate>
</rect>
</text>
</g>
</g>
</g>
<!-- Geometric Subtle Accents in Corner -->
<g fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1">
<path d="M 1240 360 L 1240 380 L 1220 380"></path>
<circle cx="1240" cy="380" fill="#38bdf8" fill-opacity="0.4" r="2"></circle>
</g>
</svg>
